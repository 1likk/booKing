databases:
  - name: booking-db
    databaseName: booking
    user: booking
    plan: free

services:
  - type: web
    name: booking
    plan: free
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn booking.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: booking-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.12.0"
