{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %} {% endblock title%}</title>
    <!-- Bootstrap -->
    <link rel="stylesheet" href="{% static 'bootstrap/css/bootstrap.min.css' %}">
    <!-- css -->
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
</head>
<body>
    <header class="header sticky-top">
        <div class="header-container d-flex">
            <nav class="header-nav">
                <ul class="header-list d-flex">
                    <li>
                        <a href="/" class="nav-a m-3">Главная страница</a>
                    </li>
                    <li>
                        <a href="#" class="nav-a m-3">Магазин</a>
                    </li>
                </ul>
            </nav>
            <div class="header-logo">
                <a href="/"><img src="{% static 'img/logo1_books.png'%}" class="booking-logo" alt="" ></a>
            </div>
            <div class="header-profile pt-2">
                <a href="{% url 'cart:cart_detail' %}"><img src="{% static 'img/cart_img.png' %}" class="cart-img"></a>
                <a href="#" class="m-2">ВОЙТИ</a>
                <p class="cart-quantity">
                    {% with cart_quantity=cart|length %}
                        {% if cart_quantity > 0 %}
                            {{cart_quantity}}
                        {% else %}
                            0
                        {% endif %}
                    {% endwith %}
                </p>
            </div>
        </div>
    </header>
    <div class="container">
        {% block content %}
        {% endblock content %}
    </div>
    <img src="{% static 'img/frame1.png'%}" class="frame1" alt="">
    <img src="{% static 'img/frame2.png'%}" class="frame2" alt="">
    <img src="{% static 'img/frame3.png'%}" class="frame3" alt="">
    <img src="{% static 'img/frame4.png'%}" class="frame4" alt="">
       <!-- js for bootstrap -->
    <script src="{% static 'bootstrap/js/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
